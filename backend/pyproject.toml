[project]
name = "task-management-backend"
version = "0.1.0"
description = "Role-based task management API"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0,<6.1",
    "djangorestframework==3.18.1",
    "djangorestframework-simplejwt",
    "drf-spectacular==0.30.0",
    "django-simple-history==3.13.0",
    "django-filter==26.2",
    "django-cors-headers",
    "celery[redis]>=5.4",
    "redis>=5",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "factory-boy",
    "ruff",
    "mypy",
]

# D3: PyPI simplejwt 5.5.1 predates PR #959 (Django 6.0 + Python 3.14 support).
# uv.lock captures this SHA, so builds stay reproducible.
# Exit criterion: drop this block once a release containing #959 ships.
[tool.uv.sources]
djangorestframework-simplejwt = { git = "https://github.com/jazzband/djangorestframework-simplejwt.git", rev = "a7cb077ea0809f78cc6a99cb6825ab7594eae627" }

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
# AGENTS.md is a read-only brief. ruff formats Python code blocks embedded in
# Markdown, which rewrites its examples; excluding it keeps the CLI and the
# pre-commit ruff hooks off a file neither is allowed to change.
extend-exclude = ["AGENTS.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "RUF012"]
"config/settings/*" = ["F403", "F405"]
# RUF012 guards against mutable class attributes shared between instances. The
# framework-declared lists in these modules — Django's REQUIRED_FIELDS and
# Meta.constraints/indexes, DRF's Meta.fields, permission_classes, filter_backends,
# search_fields, ordering — are read once at class creation and never mutated, so
# the hazard does not apply. Same reason migrations ignore it. Services,
# repositories and dispatchers are still checked, which is where it would matter.
"apps/*/models.py" = ["RUF012"]
"apps/*/*serializers.py" = ["RUF012"]
"apps/*/*views.py" = ["RUF012"]
"apps/*/filters.py" = ["RUF012"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
files = ["apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
# The gate is 80 per spec §12.1, not the 100 the suite currently reaches: it is a
# floor that must not be crossed, not a target that forbids ever adding code
# ahead of its test within a single commit.
addopts = "--strict-markers --cov=apps --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py"]

[tool.coverage.report]
# Excluded because a test over them would assert nothing about behaviour, not
# because they are inconvenient. Every error path, guard and business branch is
# tested instead — see apps/core/tests/test_error_paths.py.
exclude_also = [
    # Debug reprs. A test would restate the f-string.
    "def __str__\\(self\\)",
    # Protocol members: the bodies are `...`, and conformance is asserted
    # structurally by the isinstance tests in each test_repositories module.
    "@abstractmethod",
    # Unreachable at runtime; present for the type checker only.
    "if TYPE_CHECKING:",
]
