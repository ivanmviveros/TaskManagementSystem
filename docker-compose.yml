services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Local SMTP sink (spec §5.4). Accepts every message the worker sends and shows
  # it in a web inbox at http://localhost:8025, so notification emails can be read
  # the way a recipient would see them. 1025 is published too, so a worker run
  # natively (outside Compose) can deliver to localhost:1025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # The only service that sends mail. service_started, not healthy: the image
      # has no healthcheck, and a send made before MailHog listens raises
      # ConnectionRefusedError, which the task's autoretry_for already retries.
      mailhog:
        condition: service_started

  # Overrides root AGENTS.md § Local Development (spec §3.4): the brief requires a
  # scheduled overdue sweep, and `worker -B` is documented by Celery as dev-only.
  beat:
    build:
      context: ./backend
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # The service exists so `docker compose up` brings the whole stack up at
  # localhost:5173. Day-to-day frontend work still runs `npm run dev` natively,
  # because Vite's HMR is noticeably faster against the native filesystem than
  # through a bind-mounted node_modules — especially on Windows. The anonymous
  # node_modules volume is what keeps the container's install from being
  # shadowed by the bind mount.
  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      # File events do not cross this bind mount on Windows/macOS; without polling
      # Vite serves stale modules after host-side edits (see vite.config.ts).
      DEV_SERVER_POLLING: "true"

volumes:
  postgres_data:
